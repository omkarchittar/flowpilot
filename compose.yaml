services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: flowpilot
      POSTGRES_USER: flowpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpilot -d flowpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      FLOWPILOT_DATABASE_URL: postgresql+psycopg://flowpilot:${POSTGRES_PASSWORD}@db:5432/flowpilot
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment: &backend_environment
      FLOWPILOT_DATABASE_URL: postgresql+psycopg://flowpilot:${POSTGRES_PASSWORD}@db:5432/flowpilot
      FLOWPILOT_OPENAI_API_KEY: ${FLOWPILOT_OPENAI_API_KEY:-}
      FLOWPILOT_GENERATION_MODEL: ${FLOWPILOT_GENERATION_MODEL:-gpt-4.1-mini}
      FLOWPILOT_ENCRYPTION_KEY: ${FLOWPILOT_ENCRYPTION_KEY:?Set a generated Fernet key in .env}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    build: ./backend
    command: ["python", "-m", "flowpilot.worker"]
    environment: *backend_environment
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  db_data:
