[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowpilot"
version = "0.1.0"
description = "FlowPilot — reliable AI systems with measurable behavior"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.40,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "cryptography>=44,<47", "email-validator>=2.2,<3",
  "pypdf>=5.4,<7", "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "httpx2>=2.13,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing to an isolated PostgreSQL database"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
